name: Deploy Firestore rules

# Publishes firebase/firestore.rules to ayvago-prod after the rules tests pass against the
# emulator. Runs when the rules change on main, or manually from the Actions tab.
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT_AYVAGO_PROD: the JSON key of a service
# account with the "Firebase Rules Admin" and "Service Usage Consumer" roles (docs/setup/phase-0.md).

on:
  push:
    branches: [main]
    paths:
      - firebase/firestore.rules
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The Firestore emulator used by the rules tests needs Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile

      - name: Test the rules against the emulator
        run: pnpm --filter @ayvago/firebase test

      - name: Deploy to ayvago-prod
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AYVAGO_PROD }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT_AYVAGO_PROD is not set (see docs/setup/phase-0.md)."
            exit 1
          fi
          key_file="$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$SERVICE_ACCOUNT" > "$key_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$key_file"
          set -o pipefail
          if ! pnpm --filter @ayvago/firebase exec firebase deploy --only firestore:rules --project prod --non-interactive 2>&1 | tee "$RUNNER_TEMP/deploy.log"; then
            # Surface the cause as annotations, visible on the run summary without opening the log.
            grep -hiE "error|denied|permission|forbidden|403" "$RUNNER_TEMP/deploy.log" firebase/firebase-debug.log 2>/dev/null \
              | grep -viE "authorization|token|private_key" | head -8 | while IFS= read -r line; do echo "::error::${line:0:400}"; done
            exit 1
          fi
