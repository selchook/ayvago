name: Deploy Firestore rules and indexes

# Publishes firebase/firestore.rules and firebase/firestore.indexes.json to ayvago-prod after the
# rules tests pass against the emulator. Runs when either changes on main, or manually from the
# Actions tab.
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT_AYVAGO_PROD: the JSON key of a service
# account with the "Firebase Rules Admin", "Cloud Datastore Index Admin" (the CLI reads the database
# metadata first) and "Service Usage Consumer" roles (docs/setup/phase-0.md).

on:
  push:
    branches: [main]
    paths:
      - firebase/firestore.rules
      - firebase/firestore.indexes.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The Firestore emulator used by the rules tests needs Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      # The emulator test suite also covers the Cloud Functions, which must be built first.
      - run: pnpm --filter @ayvago/functions build

      - name: Test the rules (and functions) against the emulators
        run: pnpm --filter @ayvago/firebase test

      - name: Deploy to ayvago-prod
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AYVAGO_PROD }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT_AYVAGO_PROD is not set (see docs/setup/phase-0.md)."
            exit 1
          fi
          key_file="$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$SERVICE_ACCOUNT" > "$key_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$key_file"
          # The account's email is not secret; showing it makes IAM problems easy to diagnose.
          echo "::notice::Deploying as $(jq -r '.client_email // "unknown"' "$key_file") (key project: $(jq -r '.project_id // "unknown"' "$key_file"))"
          log="$RUNNER_TEMP/deploy.log"
          # --debug output goes to a file only; on failure the cause (the CLI's own message is just
          # "Failed to authenticate") is surfaced as annotations, with credential lines removed.
          if pnpm --filter @ayvago/firebase exec firebase deploy --only firestore:rules,firestore:indexes --project prod --non-interactive --debug > "$log" 2>&1; then
            grep -E "Deploy complete|released rules|indexes" "$log" | sed 's/\x1b\[[0-9;]*m//g' || true
          else
            sed 's/\x1b\[[0-9;]*m//g' "$log" \
              | grep -E "Error|error:|denied|PERMISSION|invalid_grant|Unexpected|HTTP [45][0-9][0-9]" \
              | grep -vE "^[[:space:]]+at |[Bb]earer|access_token|refresh_token|private_key" \
              | head -8 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          fi
