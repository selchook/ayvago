name: Deploy Cloud Functions

# Publishes firebase/functions to ayvago-prod (europe-west1) after the rules and functions tests
# pass against the emulators. Runs when the functions or the shared code they bundle change on
# main, or manually from the Actions tab. Uses the same service account secret as the rules
# deploy; the extra roles it needs are listed in docs/setup/phase-0.md.

on:
  push:
    branches: [main]
    paths:
      - firebase/functions/**
      - packages/shared/src/**
      - firebase/firebase.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The Firestore emulator used by the tests needs Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ayvago/functions build

      - name: Test rules and functions against the emulators
        run: pnpm --filter @ayvago/firebase test

      - name: Deploy to ayvago-prod
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AYVAGO_PROD }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT_AYVAGO_PROD is not set (see docs/setup/phase-0.md)."
            exit 1
          fi
          key_file="$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$SERVICE_ACCOUNT" > "$key_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$key_file"
          echo "::notice::Deploying as $(jq -r '.client_email // "unknown"' "$key_file")"
          log="$RUNNER_TEMP/deploy.log"
          # --force: non-interactive deploys may delete functions removed from the source and set
          # the container image cleanup policy without prompting.
          if pnpm --filter @ayvago/firebase exec firebase deploy --only functions --project prod --non-interactive --force --debug > "$log" 2>&1; then
            grep -E "Deploy complete|Successful (create|update)" "$log" | sed 's/\x1b\[[0-9;]*m//g' || true
          else
            sed 's/\x1b\[[0-9;]*m//g' "$log" \
              | grep -E "Error|error:|denied|PERMISSION|invalid_grant|Unexpected|HTTP [45][0-9][0-9]|failed" \
              | grep -vE "^[[:space:]]+at |[Bb]earer|access_token|refresh_token|private_key" \
              | head -10 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          fi
