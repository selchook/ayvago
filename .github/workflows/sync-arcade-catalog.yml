name: Sync arcade catalog

# The Ayvago Arcade games are made in selchook/ayvago-games (the studio, ADR 0011). Its CI keeps
# platform/arcade-catalog.ts current on main; this workflow copies that file into
# packages/shared/src/arcade-catalog.ts and opens (or updates) one PR. The games are deployed by
# the time their catalog entry arrives here, so the order is always right.
# The same run copies the studio's game guides (platform/arcade-guides.json, the written text of
# the game pages, docs/adr/0027-game-guides-as-page-content.md) into
# apps/web/content/arcade-guides.json, so a game and its guide land in the same PR. Until the
# studio publishes that file, the platform keeps its own copy.
# Needs "Allow GitHub Actions to create and approve pull requests" (Settings → Actions → General,
# docs/setup/phase-2.md §18).

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sync-arcade-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the catalog and the guides from ayvago-games main
        id: fetch
        # Authenticated calls: anonymous GitHub API requests share the runner's IP rate limit and
        # failed with 403 (then a 404 for the "null" commit). The studio repo is private, so the
        # reads use STUDIO_READ_TOKEN, a repository secret holding a read-only token for
        # selchook/ayvago-games (Contents: read; docs/setup/phase-5.md §5.36). Without the secret
        # the workflow's own token is used, which can only read the studio while it is public.
        env:
          GH_TOKEN: ${{ secrets.STUDIO_READ_TOKEN || github.token }}
          HAS_STUDIO_TOKEN: ${{ secrets.STUDIO_READ_TOKEN != '' }}
        run: |
          sha=$(gh api repos/selchook/ayvago-games/commits/main --jq .sha) || true
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            if [ "$HAS_STUDIO_TOKEN" != "true" ]; then
              echo "::error::Could not read selchook/ayvago-games. The studio repository is private: add the STUDIO_READ_TOKEN secret (docs/setup/phase-5.md §5.36)."
              exit 1
            fi
            echo "::error::Could not read the commit of selchook/ayvago-games main (got '$sha')."
            exit 1
          fi
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/selchook/ayvago-games/contents/platform/arcade-catalog.ts?ref=$sha" \
            > packages/shared/src/arcade-catalog.ts
          # The guides: a missing file (404) keeps the platform's copy; any other error fails.
          guides=apps/web/content/arcade-guides.json
          if gh api -H "Accept: application/vnd.github.raw" \
            "repos/selchook/ayvago-games/contents/platform/arcade-guides.json?ref=$sha" \
            > "$RUNNER_TEMP/guides.json" 2> "$RUNNER_TEMP/guides.err"; then
            if ! jq -e '.version == 1 and (.guides | type == "object")' "$RUNNER_TEMP/guides.json" > /dev/null; then
              echo "::error::platform/arcade-guides.json on selchook/ayvago-games@${sha:0:7} is not a version 1 guide file."
              exit 1
            fi
            cp "$RUNNER_TEMP/guides.json" "$guides"
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/guides.err"; then
            echo "::notice::selchook/ayvago-games@${sha:0:7} has no platform/arcade-guides.json yet; keeping $guides."
          else
            cat "$RUNNER_TEMP/guides.err"
            echo "::error::Could not read platform/arcade-guides.json from selchook/ayvago-games."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The catalog and the guides match selchook/ayvago-games@${sha:0:7}."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Open or update the PR
        if: steps.fetch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.fetch.outputs.sha }}
        run: |
          branch=arcade-catalog-sync
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add packages/shared/src/arcade-catalog.ts apps/web/content/arcade-guides.json
          git commit -qm "Sync the arcade catalog from ayvago-games" \
            -m "Source: selchook/ayvago-games@$SHA (platform/arcade-catalog.ts, platform/arcade-guides.json)."
          git push --force origin "$branch"
          body="Generated by the **Sync arcade catalog** workflow from selchook/ayvago-games@${SHA} \`platform/arcade-catalog.ts\` and \`platform/arcade-guides.json\`. The games are already deployed on the arcade origin; merging lists them on ayvago.com with their guides and redeploys the Cloud Functions (score sessions read the catalog)."
          if [ "$(gh pr view "$branch" --json state -q .state 2>/dev/null)" = "OPEN" ]; then
            gh pr comment "$branch" --body "Updated to selchook/ayvago-games@${SHA}."
          else
            gh pr create --base main --head "$branch" --title "Sync the arcade catalog from ayvago-games" --body "$body"
          fi
          gh workflow run ci.yml --ref "$branch"
