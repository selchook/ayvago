name: Sync arcade catalog

# The Ayvago Arcade games are made in selchook/ayvago-games (the studio, ADR 0011). Its CI keeps
# platform/arcade-catalog.ts current on main; this workflow copies that file into
# packages/shared/src/arcade-catalog.ts and opens (or updates) one PR. The games are deployed by
# the time their catalog entry arrives here, so the order is always right.
# Needs "Allow GitHub Actions to create and approve pull requests" (Settings → Actions → General,
# docs/setup/phase-2.md §18).

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sync-arcade-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the catalog from ayvago-games main
        id: fetch
        run: |
          sha=$(curl -fsSL -H "Accept: application/vnd.github+json" https://api.github.com/repos/selchook/ayvago-games/commits/main | jq -r .sha)
          curl -fsSL "https://raw.githubusercontent.com/selchook/ayvago-games/$sha/platform/arcade-catalog.ts" \
            -o packages/shared/src/arcade-catalog.ts
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The catalog matches selchook/ayvago-games@${sha:0:7}."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Open or update the PR
        if: steps.fetch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.fetch.outputs.sha }}
        run: |
          branch=arcade-catalog-sync
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git commit -qam "Sync the arcade catalog from ayvago-games" \
            -m "Source: selchook/ayvago-games@$SHA (platform/arcade-catalog.ts)."
          git push --force origin "$branch"
          body="Generated by the **Sync arcade catalog** workflow from selchook/ayvago-games@${SHA} \`platform/arcade-catalog.ts\`. The games are already deployed on the arcade origin; merging lists them on ayvago.com and redeploys the Cloud Functions (score sessions read the catalog)."
          if [ "$(gh pr view "$branch" --json state -q .state 2>/dev/null)" = "OPEN" ]; then
            gh pr comment "$branch" --body "Updated to selchook/ayvago-games@${SHA}."
          else
            gh pr create --base main --head "$branch" --title "Sync the arcade catalog from ayvago-games" --body "$body"
          fi
          gh workflow run ci.yml --ref "$branch"
