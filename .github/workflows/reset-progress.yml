name: Reset progress

# Resets every player's progress on ayvago-prod for the fresh start of slice 5.13
# (docs/adr/0017-server-best-and-fresh-start.md): leaderboards, play statistics, XP, levels and
# achievements, the account copies of best scores, and score sessions. Profiles, favorites, votes,
# game counters, rankings, rooms, usernames, roles and bans stay.
#
# Run it from the Actions tab: first with dry_run on (backs up and counts), then with dry_run off.
# Both runs need the confirmation phrase. The backup is uploaded as an artifact kept for 90 days.
# Uses the deploy service account, which needs the "Cloud Datastore User" role for this
# (docs/setup/phase-5.md, slice 5.13); the secret is only ever written to a temporary key file.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RESET ALL PROGRESS to continue
        required: true
        type: string
      dry_run:
        description: Dry run (back up and count only, delete nothing)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: reset-progress
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation phrase
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "RESET ALL PROGRESS" ]; then
            echo "::error::The confirm input must be exactly: RESET ALL PROGRESS"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @ayvago/functions

      - name: Back up and reset
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AYVAGO_PROD }}
          CONFIRM: ${{ inputs.confirm }}
          DRY_RUN: ${{ inputs.dry_run }}
          FIREBASE_PROJECT_ID: ayvago-prod
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT_AYVAGO_PROD is not set (see docs/setup/phase-0.md)."
            exit 1
          fi
          key_file="$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$SERVICE_ACCOUNT" > "$key_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$key_file"
          mkdir -p "$RUNNER_TEMP/backup"
          backup="$RUNNER_TEMP/backup/progress-backup-$(date -u +%Y%m%dT%H%M%SZ).json"
          cd firebase/functions
          if [ "$DRY_RUN" = "false" ]; then
            node scripts/reset-progress.mjs --backup "$backup" --execute --confirm "$CONFIRM"
          else
            node scripts/reset-progress.mjs --backup "$backup"
          fi

      - name: Upload the backup
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: progress-backup-${{ github.run_id }}-${{ inputs.dry_run && 'dry-run' || 'reset' }}
          path: ${{ runner.temp }}/backup/
          if-no-files-found: ignore
          retention-days: 90
