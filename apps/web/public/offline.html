<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#201e1d" />
    <title>Ayvago · Offline</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #201e1d;
        color: #f3f2f2;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        min-height: 100%;
        display: grid;
        place-content: center;
        gap: 18px;
        padding: 24px;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
        margin: 0 auto;
      }
      h1 {
        margin: 0;
        font-size: 1.4rem;
        color: #ffd23f;
      }
      p {
        margin: 0;
        color: #b5b0ae;
        line-height: 1.5;
      }
      button {
        justify-self: center;
        font: inherit;
        font-weight: 700;
        color: #fff;
        background: #e02a10;
        border: 3px solid #000;
        box-shadow: 0 4px 0 #000;
        padding: 12px 22px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>İnternet bağlantısı yok · You're offline</h1>
      <p>Oyunlar bağlantı gelince açılır.<br />Games load again once you're back online.</p>
      <button type="button" onclick="location.reload()">Tekrar dene · Try again</button>
    </main>
  </body>
</html>
